<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padaria Pão Saboroso — Login</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
        .login-card {
            width: min(460px, 100%);
            padding: 40px;
            border-radius: 32px;
            background: rgba(255, 253, 248, 0.88);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }
        .login-card h1 { font-family: 'Fraunces', serif; font-size: 2rem; margin: 8px 0 4px; }
        .login-card p { color: var(--muted); margin: 0 0 28px; }
        .login-card label { display: grid; gap: 6px; font-weight: 700; color: var(--muted); margin-bottom: 16px; }
        .login-card input {
            width: 100%; border: 1px solid var(--line); border-radius: 14px;
            padding: 12px 14px; background: rgba(255,255,255,0.82);
            color: var(--text); font: inherit;
        }
        .login-card input:focus { outline: 2px solid rgba(180,79,47,0.22); border-color: var(--accent); }
        .login-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
        .login-actions .button { width: 100%; padding: 14px; border-radius: 14px; font-size: 1rem; }
        .login-links { display: flex; justify-content: space-between; margin-top: 16px; font-size: 0.88rem; color: var(--muted); }
        .login-links a { color: var(--accent); font-weight: 700; }
        #mensagemErro { color: var(--danger); font-size: 0.88rem; margin: 8px 0 0; font-weight: 700; min-height: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <p class="eyebrow">🥐 Padaria Pão Saboroso</p>
        <h1>Bem-vindo de volta</h1>
        <p>Acesse o painel de gestão da padaria.</p>

        <form action="/login" method="post">
            <label for="email">
                E-mail
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </label>
            <label for="password">
                Senha
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </label>
            <p id="mensagemErro"></p>
            <div class="login-actions">
                <button class="button" type="submit">Entrar</button>
            </div>
        </form>

        <div class="login-links">
            <a href="/login/recuperar-senha">Esqueci minha senha</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search)
        const erro = params.get('erro')
        if (erro) document.getElementById('mensagemErro').textContent = erro
    </script>
</body>
</html>
